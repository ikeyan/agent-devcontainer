# rootless Podman のエンジン設定 (devcontainer 内)。
# devcontainer には systemd / journald が無いので cgroupfs マネージャ + file ロガーにする。
# rootless ネットワークは slirp4netns: ネストしたコンテナの egress は dev コンテナの netns を
# 通るので、init-firewall.sh の iptables (proxy + allowlist のみ) がそのまま効く。
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

[network]
default_rootless_network_cmd = "slirp4netns"

[project]
name = "agent-devcontainer"
version = "0.1.0"
description = ".devcontainer の Python 依存 (secrets-proxy/redact の mitmproxy と検査系)"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.2.3",
    "hypothesis>=6",
    "PyYAML>=6",
    "jsonschema>=4",
    "tree-sitter~=0.25",
    "tree-sitter-containerfile~=0.9.2",
    "ruff>=0.17.1",
    "vulture>=2.16",
]

# redact イメージ (Dockerfile の redact ステージ) が `uv pip install --group redact` で読む。
# mitmproxy だけを厳密に固定する (hypothesis/PyYAML を巻き込まない)。
[dependency-groups]
redact = ["mitmproxy==12.2.3"]

# 供給網の門 (setup-repo の 2 節)。exclude-newer は公開から 3 日経っていない配布物を解決に使わない
# (uv.lock には期間 exclude-newer-span として残る。canon: facts/uv/exclude-newer-relative-span-lock)。
# no-build は sdist のビルド (任意コードの実行) を許さず、wheel だけを使う。
[tool.uv]
exclude-newer = "3 days"
no-build = true

[tool.ruff]
target-version = "py312"
line-length = 120

# 規則は ruff の既定 (uv.lock が固定する ruff の版で決まる。版上げは Dependabot の PR の CI で差が見える)。
[tool.ruff.lint]
ignore = [
    "UP031",  # % 書式: 書き方の好みで、挙動の誤りを指さない
    "SIM103",  # 早期 return を 1 式にまとめる: 書き方の好み
    "TRY004",  # 型の検査に TypeError を求める: ここの型の検査は外部入力の検証で、呼び出し側は ValueError / RuntimeError で捕まえる
]
# vulture の noqa (V1xx) を ruff が未知の規則として扱わないようにする
external = ["V"]

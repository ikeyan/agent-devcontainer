# redact サンドボックス専用 resolver。子 claude に DNS「転送」を一切させないのが肝。
#
# 設計:
#  - server= を持たず no-resolv + no-hosts なので upstream へも /etc/hosts へも寄らず、hostsdir に
#    置かれた厳密名 (api.anthropic.com / platform.claude.com) だけを応答し、それ以外 (サブドメイン
#    含む) は REFUSED。server=/host/ 方式は suffix 一致で DNS 持ち出し経路になる
#    (canon: facts/network/dnsmasq-log-queries-and-server-suffix)。
#  - CDN IP ローテーション追従と ipset allowed-domains の更新は entrypoint の root refresher が
#    担う (upstream を dig で直接引いて hostsdir の A レコードと ipset を書き換える)。dnsmasq の
#    ipset= は「転送時のみ」働くのでここでは使わない。
#
# hostsdir のファイルは refresher が `<ip> <name>` 形式で書き、dnsmasq は変更を inotify で自動再読込する。

no-resolv
no-hosts
bind-interfaces
listen-address=127.0.0.1

hostsdir=/run/redact/hosts.d

# log-queries は付けない: 子の DNS クエリ名 (秘密を含みうる) をログへ残さない (既定で非ログ)。

# gh CLI の認証設定を dev へ seed する placeholder。実トークンは dev に置かない (機構は
# canon: facts/gh/oauth-token-verbatim-and-proxy-mitm-substitution / canon: facts/gh/config-migration-version-seed、対象ホストは
# .devcontainer/project/rules.yaml「api.github.com」)。
# user 名の GITHUB_USER placeholder (@@ 区切り) は kit テンプレート用 — Dockerfile が build arg
# PROJECT_GH_USER (project/.env 所有) で焼き込む (この行に token を書くと sed に巻き込まれるので略記)。
# @@SECRET_github_token@@ は secrets-proxy が実行時に substitute する placeholder で、build 後も
# このまま残す。YAML の plain scalar は `@` 始まりを許さないため quote する。
github.com:
    users:
        "@@GITHUB_USER@@":
            oauth_token: "@@SECRET_github_token@@"
    git_protocol: https
    oauth_token: "@@SECRET_github_token@@"
    user: "@@GITHUB_USER@@"

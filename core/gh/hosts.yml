# gh CLI の認証設定を dev へ seed する placeholder。実トークンは dev に置かない (機構は
# docs/verified-facts/gh.md「gh CLI / 認証」「gh CLI / config マイグレーション」、対象ホストは
# .devcontainer/project/rules.yaml「api.github.com」)。
github.com:
    users:
        ikeyan:
            oauth_token: "@@SECRET_github_token@@"
    git_protocol: https
    oauth_token: "@@SECRET_github_token@@"
    user: ikeyan

# インフラ/レジストリ等の proxy をバイパスするドメイン。dev の NO_PROXY と init-firewall.sh の
# ALLOWED_DOMAINS と整合させる。github.com は意図的に含めない (suffix 一致の罠と codeload.github.com の
# 扱いは canon: facts/network/no-proxy-suffix-match-and-trailing-comma)。
# project 分は project/.env の PROJECT_NO_PROXY (空エントリは各実装が無視する)。
x-no-proxy: &no_proxy "localhost,127.0.0.1,::1,host.docker.internal,registry.npmjs.org,api.anthropic.com,docs.claude.com,code.claude.com,platform.claude.com,console.anthropic.com,claude.ai,sentry.io,statsig.com,jsr.io,api.jsr.io,npm.jsr.io,api.socket.dev,firewall-api.socket.dev,objects.githubusercontent.com,release-assets.githubusercontent.com,marketplace.visualstudio.com,vscode.blob.core.windows.net,update.code.visualstudio.com,pypi.org,files.pythonhosted.org,codeload.github.com,${PROJECT_NO_PROXY:-}"
x-proxy: &proxy "http://secrets-proxy:8080"
x-ca-bundle: &ca_bundle "/etc/ssl/certs/ca-certificates.crt"
# gh seed 用 GitHub user 名 (project/.env 所有)。build.args (焼込) と environment (init-firewall.sh の
# rebuild 漏れ整合検査 — 起動ごとに現在値) が同じ値を使うので anchor で共有。:- (空既定) にするのは、
# compose が service 選択前に全体を補間するため :? だと dev と無関係な compose 呼び出し (bootstrap /
# proxy-web の secrets-proxy) まで gate してしまうから。未設定・不正の fail-closed は dev build の
# Dockerfile assert ([[ =~ ^[A-Za-z0-9-]+$ ]]、空も弾く) が担う。
x-gh-user: &gh_user ${PROJECT_GH_USER:-}

# 相対ホストパスの基準ディレクトリ (重要 — 善意の誤修正ガード):
#   devcontainer.json は dockerComposeFile を ["project/compose.yaml", "core/compose.yaml"] の順で
#   列挙し、devcontainers CLI は各要素をその順で -f に渡す (--project-directory は付けない。出典:
#   canon: facts/devcontainer/compose-f-flags-preserve-order-no-project-directory)。compose の project directory は最初の -f のディレクトリ =
#   .devcontainer/project/ になる。よってこの core/compose.yaml 内の相対ホストパス (bind source /
#   build context / seccomp ファイル) は core/ ではなく project/ 基準で解決される。core/ 配下を指すには
#   ./X ではなく ../core/X と書くこと (./X に戻すと project/X = 不在パスを指して壊れる)。
#   project/ と core/ は .devcontainer/ 直下の同深度なので、.devcontainer/ 自身やリポジトリルートを指す
#   `..` / `../..` / `../project` はどちらの基準でも同じ絶対パスに解決される (既存のこれらが正しい理由)。
#   ホスト側パスの実在は make check-compose-paths が stat で pin する。
services:
  # ---- 開発コンテナ (Claude Code を sandbox なしで動かす。秘密は持たない) ----
  dev:
    build:
      context: ..                # project/ 基準でも core/ 基準でも .devcontainer/ (同深度)。build context は生成 Dockerfile のある .devcontainer/
      dockerfile: Dockerfile
      target: dev
      args:
        # gh seed (core/gh/hosts.yml) の @@GITHUB_USER@@ を build 時に焼き込む (build.args は
        # 最初の -f の dir の .env から補間される: canon: facts/docker/compose-project-directory-and-env-resolution)。
        # 未設定・空・不正は Dockerfile の ARG assert が fail-closed に落とす (:- なので compose では通す)。
        PROJECT_GH_USER: *gh_user
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN     # iptables / ipset (create/add)
      - NET_RAW       # iptables -m set が raw socket で ipset を問い合わせる (canon: facts/capabilities/ipset-requires-net-raw)
      - SETUID        # firewall 再実行用の sudo
      - SETGID
    # rootless Podman 用の tailored seccomp profile (生成/追従/根拠は PODMAN.md「seccomp profile」)。
    security_opt:
      - seccomp=../core/podman/seccomp.json  # project directory (project/) 基準の相対パス → core/ 配下。compose が本文を展開する (canon: facts/docker/compose-seccomp-path-resolution)。
      # dev の Docker 既定 /proc マスク (ro /proc/sys・masked /proc/kcore 等) があると、ネスト
      # rootless Podman の fresh /proc mount が EPERM で弾かれる。マスクを外して通す。
      # 機構と防御低下の評価は PODMAN.md「blast-radius」。
      - systempaths=unconfined
    # rootless Podman の slirp4netns が要る /dev/net/tun。cap_drop:ALL で CAP_MKNOD が無く
    # コンテナ内で mknod できないので host (VM) のノードを渡す。
    devices:
      - /dev/net/tun:/dev/net/tun
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --use-env-proxy: Node の undici に HTTP_PROXY/HTTPS_PROXY/NO_PROXY を効かせる (canon: facts/nodejs/fetch-ignores-proxy-env-without-flag)。
      NODE_OPTIONS: "--max-old-space-size=4096 --use-env-proxy"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      CHECKPOINT_DISABLE: "1"
      # gh seed 整合検査用 (init-firewall.sh が焼込値と照合)。environment はコンテナ起動時に
      # 常に現在値になる (build arg と違い recreate に追従する) ので、「.env を変えたのに
      # rebuild していない」drift の検出源として使える。秘密ではない (GitHub user 名)。
      PROJECT_GH_USER: *gh_user
      # Web/API は secrets-proxy 経由、インフラ系は NO_PROXY で直結。
      HTTP_PROXY: *proxy
      HTTPS_PROXY: *proxy
      http_proxy: *proxy
      https_proxy: *proxy
      NO_PROXY: *no_proxy
      no_proxy: *no_proxy
      # proxy が MITM する HTTPS を検証するための CA。NODE_EXTRA_CA_CERTS だけは「既定への追記」で、
      # 残りは proxy CA を追記済みのシステムバンドル (install-proxy-ca.sh) を指す。
      NODE_EXTRA_CA_CERTS: /etc/secrets-proxy-ca/proxy-ca-cert.pem
      REQUESTS_CA_BUNDLE: *ca_bundle
      SSL_CERT_FILE: *ca_bundle
      CURL_CA_BUNDLE: *ca_bundle
    volumes:
      - ../..:/workspace:delegated  # project/ 基準でも core/ 基準でもリポジトリルート (同深度)
      # ホストの .claude/settings.local.json (ローカル設定) を {} で覆ってコンテナの claude に入るのを防ぐ。
      # bind 先は devcontainer.json の initializeCommand が事前に用意する (canon: facts/docker/desktop-macos-bind-mount-missing-target)。
      - ../core/claude/local-mask.json:/workspace/.claude/settings.local.json:ro  # project directory (project/) 基準 → core/ 配下
      # gh の hosts.yml は bind せず build 時に生成する (Dockerfile の gh seed 節)。gh auth login
      # (実トークン焼込) は root 所有の file+dir で封じる (canon: facts/gh/config-dir-read-write-permission-enforcement)。
      - bashhistory:/commandhistory
      - claude-config:/home/node/.claude
      # host(mac) の .venv を隠すコンテナ専用 volume (kit 自身の python 検査環境)。
      - venv:/workspace/.devcontainer/.venv
      # rootless Podman の image/コンテナストア volume。
      - podman:/home/node/.local/share/containers
      # proxy が publish する CA 公開証明書 (read-only)
      - proxy-ca:/etc/secrets-proxy-ca:ro
    networks:
      - devnet
    depends_on:
      secrets-proxy:
        condition: service_healthy

  # ---- 秘密注入プロキシ (信頼境界。秘密はここだけに存在する) ----
  secrets-proxy:
    build:
      context: ../core/secrets-proxy  # project directory (project/) 基準 → core/ 配下
    cap_drop:
      - ALL
    # bootstrap で対話認証し、 BW_SESSION を `proxy-bw` へ保存する。
    # bootstrap 前なら起動失敗し dev も起動しない (fail-close)。
    #   make -C .devcontainer/core bootstrap
    #   (単一 -f の生 compose を直に叩くと project 名が core になり session が別 volume namespace へ
    #    書かれ復旧不能ループになる。make target は project 層込みの 2 ファイル -f で project 名を保つ)
    environment:
      # bootstrap 時の bw config server。値は project/.env の PROJECT_BW_SERVER (project 層所有)。
      BW_SERVER: ${PROJECT_BW_SERVER:-}
    volumes:
      # project 層の rules.yaml の親ディレクトリ (個別ファイル bind は避ける。canon: facts/docker/desktop-macos-bind-mount-missing-target)
      # rules.yaml が無ければ起動しない。schema/addon/検証は core 側に残る。
      - ../project:/config-src:ro
      - proxy-ca:/ca                        # CA 公開証明書を dev と共有 (proxy が書く)
      - proxy-confdir:/home/mitm/.mitmproxy # CA 秘密鍵はこの proxy 専用 volume に留まる
      - proxy-bw:/home/mitm/.bw             # == $BITWARDENCLI_APPDATA_DIR; bw のログイン状態を `session.key` に永続化
    networks:
      - devnet              # dev からの :8080 を受ける (v4)
      - proxy-upstream     # Vaultwarden 等 upstream への egress (v4,v6)
    # CA を publish 済みかつ proxy から HTTP 応答が返ることを確認する。curl exits 0 <=> 応答あり
    # 未登録ホスト宛は addon が遮断して 403 を返す。
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /ca/proxy-ca-cert.pem && curl -sS -o /dev/null --max-time 2 -x http://127.0.0.1:8080 http://proxy.health.invalid/
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 90s

networks:
  # dev <-> proxy の v4 ブリッジ。dev の egress 制限は init-firewall.sh (iptables/v4) が担う。
  devnet:
    enable_ipv6: false  # IPv6 を有効にすると dev が v6 で egress 制限を迂回できてしまう。
  # secrets-proxy 専用の upstream。IPv6 を有効化する。dev は排除 => dev に v6 経路は存在しない。
  proxy-upstream:
    enable_ipv6: true

volumes:
  bashhistory:
  claude-config:
  venv:
  podman:
  proxy-ca:
  proxy-confdir:
  proxy-bw:

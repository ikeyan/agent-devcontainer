# proxychains-ng config (devcontainer / dev)。
# 用途: HTTP_PROXY を尊重しないコマンドを secrets-proxy 経由に通す。使い方は `pc <cmd>` (README 参照)。
# 注意: [ProxyList] は数値 IP のみ (hostname 不可, proxychains-ng の仕様)。secrets-proxy の IP は compose で動的なので、
# `pc` (/usr/local/bin/pc) が起動時に解決して @@SECRETS_PROXY_IP@@ を実 IP に差し替える。
# 直接 proxychains4 を使うと placeholder が未展開で失敗するので `pc` を使うこと。

# 単一 proxy なので strict でよい (決定的な単一ホップ)。
strict_chain

# ホスト名解決を proxy 経由にする: getaddrinfo を捕まえて捏造 IP (remote_dns_subnet) を返し、
# connect 時にホスト名へ復元して `CONNECT <host>:port` として proxy に送る。これにより secrets-proxy が
# ホスト名で rules.yaml を照合・注入できる (redsocks の SO_ORIGINAL_DST=IP 落ちが起きない優位点)。
proxy_dns
remote_dns_subnet 224

tcp_read_time_out 15000
tcp_connect_time_out 8000

# proxychains 自身のログを抑制し、wrap したコマンドの出力を汚さない。
quiet_mode

# ローカル (IPv4/IPv6 loopback) / RFC1918 / link-local は proxy を通さず直結 (host.docker.internal の
# ローカルサービス等を誤って proxy に吸わせない。安定した範囲だけ; CDN IP 追従は不要)。
# ::1 は localhost が IPv6 先解決される場合に必要 (dev net は v6 無効だが lo の ::1 は存在する)。
localnet 127.0.0.0/255.0.0.0
localnet ::1/128
localnet 10.0.0.0/255.0.0.0
localnet 172.16.0.0/255.240.0.0
localnet 192.168.0.0/255.255.0.0
localnet 169.254.0.0/255.255.0.0

[ProxyList]
http @@SECRETS_PROXY_IP@@ 8080

# secrets-proxy の注入ルール（実設定。git 管理。project 層 — 機構本体は core/ 側)。
# 秘密は含まない（Vaultwarden のアイテム名と宛先ホストだけ）。全ルール型 (inject/capture/substitute/block)
# の構造・必須項目は core/secrets-proxy/rules.schema.json を参照
# (`make -C core check-rules` で検証)。
#
# 守るべき不変条件 (ルール追加時に維持する):
#   - 応答に現れる「本物の値」は全てプレースホルダに置換してから dev に返す
#   - 捕獲/注入した秘密は bind で指定した宛先ホストにしか復元しない
#   - dev が本物の値を持つリクエストは即遮断 (detect_leaks)

# hosts / allow_hosts / passthrough_hosts のどれにも無いホストを 403 で弾く。
# 既定 true (core/secrets-proxy/addon.py:108-109 の初期値、:120-121 の cfg.get フォールバックとも true)。
# 変える必要が無ければ省略してよいが、意図を残すため明記する。
block_unlisted: true

# リクエストに本物の捕獲済み秘密が現れたら遮断 (dev は本物を持たないはず = 漏洩検知)。
# 既定 true (block_unlisted と同じ箇所: addon.py:108-109 / :120-121)。
detect_leaks: true

# ---- 到達を許可するだけのホスト (inject/capture なし。block_unlisted の例外) ----
# allow_hosts:
#   - "example.com"

# ---- 宛先ホストごとの inject / capture / substitute ルール ----
# 例: 静的トークンを Authorization ヘッダに注入 (inject のみ。リスト短縮形も可)
# hosts:
#   "api.example.com":
#     inject:
#       - secret: { item: "Example API", field: password }
#         into: { type: header, name: Authorization, value: "Bearer ${secret}" }

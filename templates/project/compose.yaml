# この repo 固有の compose 層。core/compose.yaml と重ねて使う。devcontainer.json が
# ["project/compose.yaml", "core/compose.yaml"] の順で列挙する (先頭 = このファイルのディレクトリが
# compose の project directory になり .env が効く。後勝ちマージで core がスカラー設定で優先)。
# 追加 volume / build args / 環境変数は services.dev 以下に足す。
name: "@@PROJECT_NAME@@"

services:
  dev: {}

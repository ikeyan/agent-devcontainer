name: devcontainer-check

# scaffold 元: agent-devcontainer。.devcontainer (core+project) の検証を PR/push ごとに回す。
# 導入先に既存の check CI があり make -C .devcontainer/core check を含むなら、このファイルは削除して良い。
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
      # node>=23.6 必須 (check-seccomp が .ts を型ストリッピングで直接実行する)
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install checkers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck dnsmasq-base proxychains4
          sudo ln -sf /usr/sbin/dnsmasq /usr/local/bin/dnsmasq
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: uv sync (kit venv)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.devcontainer/.venv
        run: uv sync --project .devcontainer/core --frozen
      - run: make -C .devcontainer/core check

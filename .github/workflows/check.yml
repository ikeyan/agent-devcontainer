name: check

# kit の受け入れゲート: (1) templates を scaffold して make -C core check を全緑に
# (2) install.sh の冪等性 (3) dev/redact/secrets-proxy イメージの実ビルド。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # node は check-seccomp が .ts を直接実行するのに使う (型ストリッピング、node>=23.6。
      # core/docs/verified-facts/nodejs.md)。pnpm/tsx は不要。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install checkers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck dnsmasq-base proxychains4
          sudo ln -sf /usr/sbin/dnsmasq /usr/local/bin/dnsmasq
          # hadolint: devcontainer 側 (core/Dockerfile の hadolint ステージ) と版を合わせる (手動更新)
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: lint (workflow のみ — actionlint は CI でだけ取得。残る lint は make check 配下)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint .github/workflows/*.yml templates/github/workflows/*.yml
      - name: Setup (kit CI 用 consumer 相当の project 層 + kit venv)
        run: make setup
      - name: make check
        run: make check
        env:
          # 正本 drift (PR 内容と無関係に発生) は PR では警告に降格。main push は fail のまま。
          DRIFT_CHECK: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}

      # internal net の DNS 無転送 (redact を proxy 中継 + internal net へ移す設計の要石) を実機 pin する。
      # docker daemon が要るので既定の make check には含めず、daemon のあるここで明示的に走らせる。
      # DNS_EGRESS_REQUIRE=1: daemon/外部 DNS が揃う CI では健全性コントロールの SKIP を FATAL に昇格し、
      # 「pin が空回りしたまま緑」を防ぐ (green = 実際に assert した、を担保)。
      - run: make -C core check-redact-dns-egress
        env:
          DNS_EGRESS_REQUIRE: "1"

      # redact イメージ実ビルド + node 子の python3>=3.12/mitmproxy 検査。docker 必須なので daemon の
      # あるここで明示実行 (per-run タグ + trap でイメージを残さない)。
      - run: make -C core check-redact-image

  install-idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh を 2 回実行 → 2 回目は no-op、project 編集は保持
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          cd "$consumer" && git init -q .
          bash "$GITHUB_WORKSPACE/install.sh" --src "$GITHUB_WORKSPACE"
          git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm scaffold
          bash "$GITHUB_WORKSPACE/install.sh" --src "$GITHUB_WORKSPACE"
          [ -z "$(git status --porcelain)" ] || { echo "2 回目の install.sh が差分を出した:"; git status --porcelain; exit 1; }
          echo "# consumer edit" >> .devcontainer/project/allow-domains.txt
          bash "$GITHUB_WORKSPACE/install.sh" --src "$GITHUB_WORKSPACE"
          grep -q "consumer edit" .devcontainer/project/allow-domains.txt || { echo "project 編集が installer に消された" >&2; exit 1; }
          rm .github/dependabot.yml
          bash "$GITHUB_WORKSPACE/install.sh" --src "$GITHUB_WORKSPACE"
          [ ! -e .github/dependabot.yml ] || { echo "更新実行 (core 既存) で consumer が削除した glue (.github/dependabot.yml) が再scaffoldされた" >&2; exit 1; }

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scaffold + gen
        run: |
          set -euo pipefail
          cp -Rp templates/project project
          cp -p templates/devcontainer.json devcontainer.json
          sed -i 's/@@PROJECT_NAME@@/kitci/' project/compose.yaml devcontainer.json
          bash core/bin/gen-dockerfile.sh > Dockerfile
      - name: Build dev / redact / secrets-proxy
        run: |
          set -euo pipefail
          # PROJECT_GH_USER: 通常は compose の build.args が project/.env から渡す (ここは compose を
          # 経ない直 build なので明示)。dev ステージの生成+assert (gh seed) がこの値で実際に走る。
          docker build --target dev --build-arg PROJECT_GH_USER=kitci -f Dockerfile .
          docker build --target redact -f Dockerfile .
          docker build core/secrets-proxy
      - name: smoke — devcontainer up (postStart を end-to-end 実行)
        run: |
          set -euo pipefail
          # build だけでは postStartCommand を実行しない。devcontainers CLI で実際に up し、
          # init-firewall の gh seed 整合検査 (capped root の hosts.yml 読取ほか) まで完走するかを pin。
          npm install -g @devcontainers/cli
          # probe は script が templates/ から kit config を temp に自己 scaffold して up する (この step の
          # 上でやる `.` の scaffold は build-images の standalone build 用で、smoke には渡さない)。
          # probe 前の dangling image を baseline に取る (cleanup が untag 由来の <none> を残さないことの delta 用)。
          dangling_before=$(docker images -f dangling=true -q | sort -u)
          # probe の失敗は「最も leak しやすい経路」なので、失敗しても残留 pin を必ず走らせる (rc を捕まえて後で判定)。
          set +e; bash core/bin/check_devcontainer_up.sh kitci; probe_rc=$?; set -e
          # 残留 pin: probe が作る資源は container/volume/network/image とも dcup-smoke-<pid> token を含む
          #   (compose 系 <proj>-<svc>・folder 系 vsc-<proj>-<hash>)。名前に token を含む資源を横断 grep で数える
          #   (^ で固定せず substring — folder image は vsc- 前置なので)。image が残れば script の name cleanup が
          #   効いていない、も同時に炙り出す。
          named=$( { docker ps -a --format '{{.Names}}'; docker images --format '{{.Repository}}'; \
                     docker volume ls --format '{{.Name}}'; docker network ls --format '{{.Name}}'; } \
                   | grep -c -- 'dcup-smoke-' || true )
          # dangling (<none>) image は名前を持たないので baseline delta で拾う (untag 系の leak を塞ぐ)。
          # CI runner は専用なので時刻 delta = probe 由来で安全 (script 側は共有ホスト向けに所有 scope)。
          # ただし digest pull した base image (FROM node@sha256:...) は RepoTags 無しで dangling filter に
          # 一致するが RepoDigests を持つ共有 cache であり leak でない。真の孤児 (RepoTags も RepoDigests も
          # 無い build byproduct) だけを数える。
          dangling_after=$(docker images -f dangling=true -q | sort -u)
          new_ids=$(comm -13 <(printf '%s\n' "$dangling_before") <(printf '%s\n' "$dangling_after"))
          # if/fi で書く: 末尾の `[ ] && printf` が偽だと while が 1 を返し、pipefail+set -e で step が
          # 無言 abort するため (loop は常に 0 で終える)。
          leaked_ids=$(printf '%s\n' "$new_ids" | while read -r i; do [ -n "$i" ] || continue; \
              if [ "$(docker image inspect "$i" --format '{{len .RepoDigests}}' 2>/dev/null)" = "0" ]; then printf '%s\n' "$i"; fi; done)
          new_dangling=$(printf '%s\n' "$leaked_ids" | grep -c . || true)
          fail=0
          [ "$probe_rc" -eq 0 ]     || { echo "probe 失敗 (rc=$probe_rc)" >&2; fail=1; }
          [ "$named" -eq 0 ]        || { echo "dcup-smoke-* 名の docker 資源が $named 件残留 (cleanup が副作用を残した)" >&2; fail=1; }
          # 残った場合は正体を出す (script の所有 scope cleanup が取りこぼした build byproduct を特定するため)。
          [ "$new_dangling" -eq 0 ] || { echo "probe 由来の dangling build byproduct が $new_dangling 件残留:" >&2; \
              printf '%s\n' "$leaked_ids" | while read -r i; do [ -n "$i" ] || continue; \
                docker image inspect "$i" --format '  id={{.Id}} tags={{.RepoTags}} digests={{.RepoDigests}} size={{.Size}}' 2>/dev/null; \
                echo "  --- history $i ---" >&2; docker history --no-trunc "$i" 2>/dev/null | head -6 >&2; \
              done >&2; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "ok  smoke cleanup — 残留なし (named dcup-smoke-* + probe 由来 dangling)"

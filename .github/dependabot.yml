# devcontainer の Dockerfile の image を tag+digest 込みで自動更新する (kit が一元管理し、
# consumer へは installer 再実行 / devcontainer-kit-update.yml で届く)。
# docker ecosystem は FROM 行だけを解析する (COPY --from= は追従しない。canon: facts/dependabot/copy-from-not-tracked-use-named-stage)。
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/core"
      - "/core/secrets-proxy"
    schedule:
      interval: "weekly"
    ignore:
      # ignore は該当 dependency の版上げ PR を止めるだけ: 同一 tag の digest 更新や node 24.x 内の
      # minor/patch (24.18.0 等) は引き続き流れる。
      - dependency-name: "node"
        versions: [">= 25"]
        # ユーザーポリシー = 最新 LTS のみ。26 は Current (LTS 化 2026-10-28)。LTS 化したら範囲を
        # ">= 27" に上げ、26 へ手動 bump する。LTS/範囲の意味論は canon: facts/dependabot/ignore-versions-blocks-tag-suffix-bumps。
      - dependency-name: "python"
        versions: [">= 3.14"]
        # ユーザーポリシー = bugfix 期間を終えた最新 (現在 3.13 / security phase)。3.14 の bugfix が
        # 終わったら (version-policy-watch.yml が release-cycle.json を読んで起票する) 範囲を ">= 3.15" へ
        # 上げ、3.14 へ bump する。先に mitmproxy (core/secrets-proxy/Dockerfile の固定版) の対応を確認する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

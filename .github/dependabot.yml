# kit の依存 (Dockerfile の image を tag+digest 込みで、workflow の action、uv と npm の lockfile) を自動更新する
# (kit が一元管理し、consumer へは installer 再実行 / devcontainer-kit-update.yml で届く)。cooldown は公開から
# 3 日経っていない版を提案しない (security update には効かない。canon: facts/dependabot/cooldown-exempts-security-updates)。
# docker ecosystem は FROM 行だけを解析する (COPY --from= は追従しない。canon: facts/dependabot/copy-from-not-tracked-use-named-stage)。
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/core"
      - "/core/secrets-proxy"
      - "/.github/actionlint"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # ignore は該当 dependency の版上げ PR を止めるだけ: 同一 tag の digest 更新や node 24.x 内の
      # minor/patch (24.18.0 等) は引き続き流れる。
      - dependency-name: "node"
        versions: [">= 25"]
        # ユーザーポリシー = 最新 LTS のみ。26 は Current (LTS 化 2026-10-28)。LTS 化したら範囲を
        # ">= 27" に上げ、26 へ手動 bump する。LTS/範囲の意味論は canon: facts/dependabot/ignore-versions-blocks-tag-suffix-bumps。
      - dependency-name: "python"
        versions: [">= 3.13"]
        # ユーザーポリシー = bugfix 期間を終えた最新 (現在 3.12 / security phase)。3.13 の bugfix
        # 終了 (2026-10-07) 後に範囲を ">= 3.14" へ上げ、3.13 へ手動 bump する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  # core/uv.lock の cooldown は core/pyproject.toml の exclude-newer と同じ日数にする (check-supply-chain が揃いを確かめる)。
  - package-ecosystem: "uv"
    directory: "/core"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  # package-lock.json の cooldown は .npmrc の min-release-age と同じ日数にする (check-supply-chain が揃いを確かめる)。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
